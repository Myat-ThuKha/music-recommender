{% extends 'base.html' %}

{% block content %}
<div class="relative flex flex-col items-center justify-center h-screen">
    <!-- Particle Background -->
    <div id="particles-js" class="absolute inset-0 z-0"></div>
    <div class="relative z-10">
        <h1 class="text-5xl font-bold text-white mb-4 animate-bounce">Discover Your Next Favorite Song</h1>
        <p class="text-lg text-gray-300 mb-8">Personalized recommendations using collaborative filtering.</p>
        {% if 'username' in session %}
            <a href="/recommend" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full transition duration-300">Get Recommendations</a>
        {% else %}
            <a href="/register" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full transition duration-300">Get Started</a>
        {% endif %}
    </div>
</div>
{% endblock %}
