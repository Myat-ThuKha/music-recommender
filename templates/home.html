{% extends 'base.html' %}

{% block content %}
<div class="relative flex flex-col items-center justify-center h-screen">
    <!-- Particle Background -->
    <div id="particles-js" class="absolute inset-0 z-0"></div>

    <div class="relative z-10 text-center animate-fade-in">
        <h1 class="text-5xl font-extrabold text-white mb-4 drop-shadow-lg">
            Feel the Beat, Discover the Vibe – Your Personalized Music Journey!
        </h1>
        <p class="text-lg text-gray-200 mb-8">
            Let the rhythm guide you with AI-powered recommendations tailored to your taste.
        </p>

        {% if 'username' in session %}
            <a href="/recommend" 
               class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-700 hover:to-purple-700 
                      text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg">
                Explore Your Vibes
            </a>
        {% else %}
            <a href="/register" 
               class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-700 hover:to-purple-700 
                      text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg">
                Get Started
            </a>
        {% endif %}
    </div>
</div>

<style>
    @keyframes fade-in {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fade-in 1.5s ease-out;
    }
</style>

{% endblock %}
