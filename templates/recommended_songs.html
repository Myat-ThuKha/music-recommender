<!-- user recommend songs list page -->
{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen">
    <!-- list of user rated songs --by user-->
    <div class="bg-yellow-100 p-6 rounded-lg bg-opacity-50 shadow-lg mb-8">
        <h3 class="text-xl font-semibold text-pink-900 mb-4">Recommended Songs Based On Your Input</h3>
        <!-- show list of songs with its related stars -->
        <ul class="space-y-4">
            {%for i in range(0, len)%} 
  
            <li class="flex justify-between items-center bg-yellow-100 p-4 rounded-lg bg-opacity-50">
                <span class="text-pink-700">{{songs[i]['name']}}</span>
                <!-- show colorful stars illustration -->
                 <div>
                    
                 {%for artist in songs[i]['artists']%}
                 <span class="text-pink-700" style = "padding:2px">{{artist}},</span>
             {%endfor%}
                 </div>
            </li>
            {%endfor%} 
            
        </ul>
    </div>
    </div>

{% endblock %}
