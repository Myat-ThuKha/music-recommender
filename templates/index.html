<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Recommendation System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; }
        h1 { color: #1DB954; }
        select, input, button { padding: 10px; margin: 5px; font-size: 16px; }
        button { background-color: #1DB954; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #17a846; }
    </style>
</head>
<body>
    <h1>Music Recommendation System</h1>
    <form action="/recommend" method="POST">
        <label for="song">Select a Song:</label><br>
        <select name="song" id="song" required>
            <option value="">-- Choose a Song --</option>
            {% for song in songs %}
                <option value="{{ song }}">{{ song }}</option>
            {% endfor %}
        </select><br>
        <label for="user_id">Enter User ID (0-99):</label><br>
        <input type="number" name="user_id" id="user_id" min="0" max="99" required><br>
        <button type="submit">Get Recommendations</button>
    </form>
</body>
</html>
