<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeScape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body class="bg-pink-900 text-white">
    <!-- Navigation Bar -->
    <nav class="bg-yellow-100 p-4 shadow-lg bg-opacity-90">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-pink-900  hover:text-teal-700 flex items-center">
                <i class="fas fa-music mr-2"></i> VibeScape
            </a>
            <div class="flex items-center space-x-4">
                {% if 'username' in session %}
                    <a class="text-pink-900 hover:text-teal-700 flex items-center" href="/info">Welcome, {{ session['username'] }}</span>
                    <a href="/recommend" class="text-pink-900 hover:text-teal-700 flex items-center">
                        <i class="fas fa-star mr-1"></i> Recommend
                    </a>
                    <a href="/eda" class="text-pink-900 hover:text-teal-700 flex items-center" href="/edit_info">
                        <i class="fas fa-chart-column mr-1"></i> EDA
                    </a>
                    <a href="/logout" class="text-pink-900 hover:text-teal-700 flex items-center">
                        <i class="fas fa-sign-out-alt mr-1"></i> Logout
                    </a>
                {% else %}
                    <a href="/login" class="text-pink-900 hover:text-teal-700 flex items-center">
                        <i class="fas fa-sign-in-alt mr-1"></i> Login
                    </a>
                    <a href="/register" class="text-pink-900 hover:text-teal-700 flex items-center">
                        <i class="fas fa-user-plus mr-1"></i> Register
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-yellow-100 p-4 text-center mt-10 bg-opacity-90">
        <p class="text-pink-700">© 2025 VibeScape. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
